<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="table" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#242019"/>
      <stop offset="1" stop-color="#141311"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0484c"/>
      <stop offset="0.5" stop-color="#d63a3e"/>
      <stop offset="1" stop-color="#c3323a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b04a"/>
      <stop offset="1" stop-color="#e8962c"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3cc0d4"/>
      <stop offset="1" stop-color="#24a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="26" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#table)"/>

  <!-- Kartenfächer: Pivot unten mittig -->
  <g transform="translate(512 800) scale(1.14)">
    <!-- hinten: Petrol -->
    <g transform="rotate(-22) translate(-186 -520)" filter="url(#shadow)">
      <rect width="372" height="520" rx="36" fill="url(#teal)"/>
      <rect x="22" y="22" width="328" height="476" rx="22" fill="none" stroke="#1a1714" stroke-opacity="0.22" stroke-width="5"/>
    </g>
    <!-- Mitte: Bernstein -->
    <g transform="rotate(-8) translate(-186 -548)" filter="url(#shadow)">
      <rect width="372" height="520" rx="36" fill="url(#amber)"/>
      <rect x="22" y="22" width="328" height="476" rx="22" fill="none" stroke="#1a1714" stroke-opacity="0.22" stroke-width="5"/>
    </g>
    <!-- vorne: Rot mit Auge -->
    <g transform="rotate(8) translate(-186 -560)" filter="url(#shadow)">
      <rect width="372" height="520" rx="36" fill="url(#red)"/>
      <rect x="22" y="22" width="328" height="476" rx="22" fill="none" stroke="#fff" stroke-opacity="0.34" stroke-width="5"/>
      <g transform="translate(186 260) scale(2.1)" fill="#fff">
        <path fill-rule="evenodd" d="M-48 0C-31-28-17-37 0-37s31 9 48 37C31 28 17 37 0 37S-31 28-48 0zm48 21a21 21 0 1 0 0-42 21 21 0 0 0 0 42z"/>
        <circle r="10"/>
      </g>
    </g>
  </g>
</svg>
